name: Build and Deploy

on:
  push:
    branches: [ west-zaza ]
  pull_request:
    branches: [ west-zaza ]

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/west-zaza-mobile

jobs:
  version:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate version
        run: |
          VERSION="1.0.$(date +%s)"
          echo "Generated version: $VERSION"
          echo "$VERSION" > .VERSION
          echo "File created:"
          ls -la .VERSION
          cat .VERSION

      - name: Set version output
        id: version
        run: |
          VERSION=$(cat .VERSION | tr -d "[:space:]\"'" | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: .VERSION
          retention-days: 1

  build:
    needs: version
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create version file from output
        run: |
          echo "${{ needs.version.outputs.version }}" > .VERSION
          echo "Version from previous job: ${{ needs.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, build]
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/west-zaza' 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/github @semantic-release/exec @semantic-release/git

      - name: Create release config
        run: |
          cat > release.config.js << 'EOF'
          export default {
            branches: [
              { name: 'west-zaza' }
            ],
            repositoryUrl: 'https://github.com/${{ github.repository }}.git',
            tagFormat: 'v${version}',
            plugins: [
              '@semantic-release/commit-analyzer',
              '@semantic-release/release-notes-generator',
              '@semantic-release/changelog',
              ['@semantic-release/github', {
                successComment: false,
                failComment: false,
                releasedLabels: false
              }],
              '@semantic-release/git',
            ],
            preset: 'angular',
          };
          EOF

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy:
    needs: [version]
    runs-on: [self-hosted, linux, x64]
    environment: GCP CI
    if: github.ref == 'refs/heads/west-zaza' 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create version file from output
        run: |
          echo "${{ needs.version.outputs.version }}" > .VERSION
          echo "Version from previous job: ${{ needs.version.outputs.version }}"

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/gcp_deploy_key
          echo "" >> ~/.ssh/gcp_deploy_key
          chmod 600 ~/.ssh/gcp_deploy_key
          ssh-keyscan -H ${{ secrets.GCP_SERVER_IP }} >> ~/.ssh/known_hosts 2>&1 || true
          cat > ~/.ssh/config << 'EOF'
          Host gcp-server
            HostName ${{ secrets.GCP_SERVER_IP }}
            User ${{ secrets.GCP_SERVER_USER }}
            IdentityFile ~/.ssh/gcp_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 3
            TCPKeepAlive yes
            ControlMaster auto
            ControlPath ~/.ssh/control-%r@%h:%p
            ControlPersist 10m
          EOF
          chmod 600 ~/.ssh/config
          echo "SSH setup completed"

      - name: Prepare deployment files
        run: |
          NEXT_VERSION=$(cat .VERSION | tr -d "[:space:]\"'" | xargs)
          echo "Deploying version: $NEXT_VERSION"
          cp .env .env.backup 2>/dev/null || echo "No existing .env file to backup"

      - name: Deploy to GCP server
        run: |
          for i in {1..3}; do
            if ssh -o ConnectTimeout=10 gcp-server 'echo "Connection successful"'; then
              break
            fi
            echo "Connection attempt $i failed, retrying..."
            sleep 5
          done
          ssh gcp-server 'mkdir -p ~/west-zaza-mobile/'
          git archive --format=tar.gz HEAD | ssh gcp-server 'cd ~/west-zaza-mobile/ && tar -xzf - && rm -f source.tar.gz'
          scp -o ConnectTimeout=30 .env gcp-server:~/west-zaza-mobile/.env
          ssh gcp-server 'ls -la ~/west-zaza-mobile/src/components/ErrorDialogue.vue || echo "ErrorDialogue.vue not found!"'
          ssh gcp-server '
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/west-zaza-mobile/
            docker builder prune -f
            chmod +x deploy.sh
            bash deploy.sh
          '
