server {
    listen 3007;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /bet/ {
        proxy_pass https://bet-prod.sportsbookengine.com/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host bet-prod.sportsbookengine.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /casino-client/providers/ {
        proxy_pass https://clientapi-prod.sportsbookengine.com/providers/;
        proxy_ssl_server_name on;
        proxy_set_header Host clientapi-prod.sportsbookengine.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /casino-client/ {
        proxy_pass https://clientapi-prod.sportsbookengine.com/client/;
        proxy_ssl_server_name on;
        proxy_set_header Host clientapi-prod.sportsbookengine.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
