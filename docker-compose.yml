version: '3.8'

services:
  sporty-clone-mobile:
    image: ghcr.io/zoroplay/west-bet24-mobile:latest
    container_name: sporty-clone-mobile
    ports:
      - "3002:80"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sbenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  sbenet:
    external: true