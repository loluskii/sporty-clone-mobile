version: '3.8'

services:
  sportsbook-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BASE_URL
        - VITE_SITE_URL
        - VITE_NEW_BASE_API
        - VITE_FEEDS_API
        - VITE_ENCRYPT_SECRET_KEY
        - VITE_APP_KEY
        - VITE_CLIENT_ID
        - VITE_CURRENCY
        - VITE_WTH_PERC
        - VITE_EXCISE_DUTY
        - VITE_FAST_ADD_AMOUNTS
        - VITE_TIMEZONE
        - VITE_MaxCombinationsByGrouping
        - VITE_MaxCouponCombinations
        - VITE_MinBonusOdd
        - VITE_MinGroupingsBetStake
        - VITE_MaxGroupingsBetStake
        - VITE_MinBetStake
        - VITE_StakeInnerMod0Combination
        - VITE_XPRESS_LAUNCH_URL
        - VITE_XPRESS_PRIVATE_KEY
        - VITE_XPRESS_PUBLIC_KEY
        - VITE_MQTT_URI
    container_name: west-zaza-mobile
    ports:
      - "3011:3010"
    networks:
      - sbenet
    restart: unless-stopped

networks:
  sbenet:
    external: true
