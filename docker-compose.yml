version: '3.8'

services:
  sportsbook-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - sbenet

networks:
  sbenet:
    external: true